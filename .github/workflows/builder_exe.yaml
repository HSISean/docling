name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name MyApp app.py

      - name: Build Docling Windows executable
        shell: powershell
        run: |
          pyinstaller `
            --onefile `
            --name "Docling" `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            app.py
      
      - name: Display generated files
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" } |
            Select-Object FullName, Length
      
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Docling.exe")) {
            throw "Expected executable was not created at dist\Docling.exe"
          }
      
      - name: Upload Docling executable
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows
          path: ${{ github.workspace }}/dist/Docling.exe
          if-no-files-found: error
