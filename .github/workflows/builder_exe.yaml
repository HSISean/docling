name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

          python --version
          python -m PyInstaller --version

      - name: Verify application source files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "app.py",
            "desktop.py",
            "redaction_engine.py",
            "requirements.txt",
            "templates\index.html"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required source file was not found: $file"
            }

            Write-Host "Verified: $file"
          }

          if (!(Test-Path "static")) {
            throw "Required source directory was not found: static"
          }

          Write-Host "Verified: static"

      - name: Locate RapidOCR configuration
        shell: pwsh
        run: |
          $rapidocrDirectory = python -c "import rapidocr, pathlib; print(pathlib.Path(rapidocr.__file__).resolve().parent)"
          $rapidocrYaml = Join-Path $rapidocrDirectory "default_models.yaml"

          Write-Host "RapidOCR directory: $rapidocrDirectory"
          Write-Host "RapidOCR configuration: $rapidocrYaml"

          if (!(Test-Path $rapidocrYaml)) {
            throw "RapidOCR default_models.yaml was not found at $rapidocrYaml"
          }

          "RAPIDOCR_YAML=$rapidocrYaml" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build Docling
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name Docling `
            --onedir `
            --noconfirm `
            --clean `
            --additional-hooks-dir pyinstaller_hooks `
            --collect-all rapidocr `
            --collect-all docling `
            --collect-all docling_core `
            --add-data "$env:RAPIDOCR_YAML;rapidocr" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            desktop.py

      - name: Verify Windows package
        shell: pwsh
        run: |
          $exe = "dist\Docling\Docling.exe"
          $internalDirectory = "dist\Docling\_internal"
          $rapidocrYaml = "$internalDirectory\rapidocr\default_models.yaml"
          $indexTemplate = "$internalDirectory\templates\index.html"
          $staticDirectory = "$internalDirectory\static"

          $requiredFiles = @(
            $exe,
            $rapidocrYaml,
            $indexTemplate
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Windows package is missing: $file"
            }

            Write-Host "Verified: $file"
          }

          if (!(Test-Path $staticDirectory)) {
            throw "Windows package is missing its static directory: $staticDirectory"
          }

          Write-Host "Verified: $staticDirectory"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zipPath = "dist\Docling-Windows.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "dist\Docling" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (!(Test-Path $zipPath)) {
            throw "Docling-Windows.zip was not generated"
          }

          Write-Host "Created Windows package: $zipPath"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows
          path: dist/Docling-Windows.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
