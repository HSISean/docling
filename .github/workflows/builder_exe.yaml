name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - updated_docling

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Locate RapidOCR configuration
        shell: pwsh
        run: |
          $rapidocrDirectory = python -c "import rapidocr, pathlib; print(pathlib.Path(rapidocr.__file__).parent)"
          $rapidocrYaml = Join-Path $rapidocrDirectory "default_models.yaml"

          Write-Host "RapidOCR directory: $rapidocrDirectory"
          Write-Host "RapidOCR configuration: $rapidocrYaml"

          if (!(Test-Path $rapidocrYaml)) {
            throw "RapidOCR default_models.yaml was not found at $rapidocrYaml"
          }

          "RAPIDOCR_YAML=$rapidocrYaml" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build Docling
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name Docling `
            --onedir `
            --noconfirm `
            --clean `
            --additional-hooks-dir pyinstaller_hooks `
            --collect-all rapidocr `
            --collect-all docling `
            --collect-all docling_core `
            --add-data "$env:RAPIDOCR_YAML;rapidocr" `
            desktop.py

      - name: Verify Windows package
        shell: pwsh
        run: |
          $exe = "dist\Docling\Docling.exe"
          $rapidocrYaml = "dist\Docling\_internal\rapidocr\default_models.yaml"

          if (!(Test-Path $exe)) {
            throw "Docling.exe was not generated at $exe"
          }

          if (!(Test-Path $rapidocrYaml)) {
            throw "RapidOCR configuration was not packaged at $rapidocrYaml"
          }

          Write-Host "Verified executable: $exe"
          Write-Host "Verified RapidOCR configuration: $rapidocrYaml"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\Docling\*" `
            -DestinationPath "dist\Docling-Windows.zip" `
            -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows
          path: dist/Docling-Windows.zip
          if-no-files-found: error
