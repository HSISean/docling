
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - windows_app

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Docling for Windows
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display build source
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

          python --version
          python -m PyInstaller --version

      - name: Verify source resources
        shell: pwsh
        run: |
          $requiredFiles = @(
            "app.py",
            "desktop.py",
            "redaction_engine.py",
            "requirements.txt",
            "templates\index.html"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required source file was not found: $file"
            }

            Write-Host "Verified source file: $file"
          }

          if (!(Test-Path "static")) {
            throw "Required source directory was not found: static"
          }

          Write-Host "Verified source directory: static"

      - name: Locate RapidOCR configuration
        shell: pwsh
        run: |
          $rapidocrDirectory = python -c "import rapidocr, pathlib; print(pathlib.Path(rapidocr.__file__).resolve().parent)"
          $rapidocrYaml = Join-Path $rapidocrDirectory "default_models.yaml"

          Write-Host "RapidOCR directory: $rapidocrDirectory"
          Write-Host "RapidOCR configuration: $rapidocrYaml"

          if (!(Test-Path $rapidocrYaml)) {
            throw "RapidOCR default_models.yaml was not found at: $rapidocrYaml"
          }

          "RAPIDOCR_YAML=$rapidocrYaml" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append
      - name: Locate Docling Parse resources
        shell: pwsh
        run: |
          $doclingParseDirectory = python -c "import docling_parse, pathlib; print(pathlib.Path(docling_parse.__file__).resolve().parent)"
          $pdfResourcesDirectory = Join-Path $doclingParseDirectory "pdf_resources"

          Write-Host "docling_parse directory: $doclingParseDirectory"
          Write-Host "PDF resources directory: $pdfResourcesDirectory"

          if (!(Test-Path $pdfResourcesDirectory)) {
            throw "docling_parse pdf_resources was not found: $pdfResourcesDirectory"
          }

          "DOCLING_PARSE_RESOURCES=$pdfResourcesDirectory" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build Docling
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name Docling `
            --onedir `
            --noconfirm `
            --clean `
            --additional-hooks-dir pyinstaller_hooks `
            --collect-all rapidocr `
            --collect-all docling `
            --collect-all docling_core `
            --collect-all docling_parse `
            --add-data "$env:RAPIDOCR_YAML;rapidocr" `
            --add-data "$env:DOCLING_PARSE_RESOURCES;docling_parse/pdf_resources" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            desktop.py

      - name: Verify Windows package
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist\Docling\Docling.exe",
            "dist\Docling\_internal\rapidocr\default_models.yaml",
            "dist\Docling\_internal\templates\index.html"
          )

          $requiredDirectories = @(
            "dist\Docling\_internal\static",
            "dist\Docling\_internal\docling_parse\pdf_resources"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required packaged file is missing: $file"
            }

            Write-Host "Verified file: $file"
          }

          foreach ($directory in $requiredDirectories) {
            if (!(Test-Path $directory)) {
              throw "Required packaged directory is missing: $directory"
            }

            $contents = Get-ChildItem $directory -Recurse -File

            if ($contents.Count -eq 0) {
              throw "Packaged directory is empty: $directory"
            }

            Write-Host "Verified directory: $directory"
            Write-Host "Contained files: $($contents.Count)"
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zipName = "Docling-Windows-$env:GITHUB_SHA.zip"
          $zipPath = Join-Path "dist" $zipName

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "dist\Docling" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (!(Test-Path $zipPath)) {
            throw "Windows ZIP was not created: $zipPath"
          }

          "WINDOWS_ZIP=$zipPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Created Windows ZIP: $zipPath"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows-${{ github.sha }}
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true