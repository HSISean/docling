name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name MyApp app.py

      - name: Build Docling Windows executable
        shell: powershell
        run: |
          pyinstaller `
            --onefile `
            --name "Docling" `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            app.py
      
      - name: Display generated files
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" } |
            Select-Object FullName, Length
      
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Docling.exe")) {
            throw "Expected executable was not created at dist\Docling.exe"
          }

      - name: Verify executable
        shell: powershell
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Recurse
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Docling.exe")) {
            throw "Docling.exe was not generated"
          }
      
      - name: Upload Docling executable
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows
          path: ${{ github.workspace }}/dist/Docling.exe
          if-no-files-found: error
          
      - name: Smoke-test Docling Windows EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\Docling.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "docling-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "docling-stderr.log"
      
          Write-Host "Starting $exe"
      
          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
      
          try {
            $deadline = (Get-Date).AddMinutes(5)
            $port = $null
      
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              $process.Refresh()
      
              if ($process.HasExited) {
                Write-Host "Docling.exe exited with code $($process.ExitCode)"
                Write-Host "--- STDOUT ---"
                if (Test-Path $stdout) { Get-Content $stdout }
                Write-Host "--- STDERR ---"
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Docling.exe terminated before its Flask server became available."
              }
      
              # Find a TCP port opened by the EXE.
              $listener = Get-NetTCPConnection `
                -State Listen `
                -OwningProcess $process.Id `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.LocalAddress -in @("127.0.0.1", "0.0.0.0", "::", "::1")
                } |
                Select-Object -First 1
      
              if ($listener) {
                $port = $listener.LocalPort
                Write-Host "Detected Flask server on port $port"
                break
              }
      
              Write-Host "Waiting for Flask server..."
            }
      
            if (-not $port) {
              Write-Host "--- STDOUT ---"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "--- STDERR ---"
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "No listening port was detected within five minutes."
            }
      
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:$port/" `
              -UseBasicParsing `
              -TimeoutSec 60
      
            Write-Host "HTTP status: $($response.StatusCode)"
      
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "Flask returned unexpected HTTP status $($response.StatusCode)."
            }
      
            Write-Host "SUCCESS: Docling.exe started and its Flask UI responded."
          }
          finally {
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F
            }
      
            Write-Host "--- STDOUT ---"
            if (Test-Path $stdout) { Get-Content $stdout }
      
            Write-Host "--- STDERR ---"
            if (Test-Path $stderr) { Get-Content $stderr }
          }
