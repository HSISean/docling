name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller waitress
          python -m pip check

      - name: Clean previous builds
        shell: pwsh
        run: |
          Remove-Item "build" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "Docling.spec" -Force -ErrorAction SilentlyContinue

      - name: Build Docling Windows executable
        shell: pwsh
        run: |
          $arguments = @(
            "--clean"
            "--noconfirm"
            "--onefile"
            "--console"
            "--name", "Docling"
            "--distpath", "$env:GITHUB_WORKSPACE\dist"
          )

          if (Test-Path "templates") {
            $arguments += @("--add-data", "templates;templates")
          }

          if (Test-Path "static") {
            $arguments += @("--add-data", "static;static")
          }

          $arguments += "desktop.py"

          python -m PyInstaller @arguments

      - name: Verify generated executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\Docling.exe"

          if (-not (Test-Path $exe)) {
            throw "Docling.exe was not generated at $exe"
          }

          $file = Get-Item $exe
          Write-Host "Executable: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -eq 0) {
            throw "Docling.exe is empty."
          }

          Get-FileHash $exe -Algorithm SHA256

      - name: Smoke-test Docling Windows executable
        shell: pwsh
        run: |
          $env:DOCLING_SKIP_BROWSER = "1"

          $exe = Resolve-Path "dist\Docling.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "docling-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "docling-stderr.log"
          $testUrl = "http://127.0.0.1:5000/"

          Write-Host "Starting $exe"

          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $deadline = (Get-Date).AddMinutes(8)
            $serverReady = $false
            $lastError = "No connection attempt completed."

            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              $process.Refresh()

              if ($process.HasExited) {
                throw "Docling.exe exited unexpectedly with code $($process.ExitCode)."
              }

              try {
                $response = Invoke-WebRequest `
                  -Uri $testUrl `
                  -UseBasicParsing `
                  -TimeoutSec 30

                Write-Host "HTTP status: $($response.StatusCode)"

                if (
                  $response.StatusCode -ge 200 -and
                  $response.StatusCode -lt 400
                ) {
                  $serverReady = $true
                  break
                }

                $lastError = "Unexpected HTTP status $($response.StatusCode)."
              }
              catch {
                $lastError = $_.Exception.Message
                Write-Host "Waiting for Docling: $lastError"
              }
            }

            if (-not $serverReady) {
              throw "Docling did not respond at $testUrl within eight minutes. Last error: $lastError"
            }

            Write-Host "SUCCESS: Docling.exe started and responded at $testUrl"
          }
          finally {
            Write-Host "--- STDOUT ---"
            if (Test-Path $stdout) {
              Get-Content $stdout
            } else {
              Write-Host "No standard-output log was created."
            }

            Write-Host "--- STDERR ---"
            if (Test-Path $stderr) {
              Get-Content $stderr
            } else {
              Write-Host "No standard-error log was created."
            }

            if ($process -and -not $process.HasExited) {
              Write-Host "Stopping Docling.exe and its child processes."
              taskkill.exe /PID $process.Id /T /F

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "taskkill returned exit code $LASTEXITCODE"
              }
            }
          }

      - name: Upload Docling executable
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows
          path: dist/Docling.exe
          if-no-files-found: error
          compression-level: 6