name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Locate RapidOCR configuration
        shell: pwsh
        run: |
          $rapidocrDirectory = python -c "import rapidocr, pathlib; print(pathlib.Path(rapidocr.__file__).parent)"
          $rapidocrYaml = Join-Path $rapidocrDirectory "default_models.yaml"

          Write-Host "RapidOCR directory: $rapidocrDirectory"
          Write-Host "RapidOCR configuration: $rapidocrYaml"

          if (!(Test-Path $rapidocrYaml)) {
            throw "RapidOCR default_models.yaml was not found at $rapidocrYaml"
          }

          "RAPIDOCR_YAML=$rapidocrYaml" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

            - name: Show build version
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:GITHUB_SHA"

      - name: Build Docling
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name Docling `
            --onedir `
            --noconfirm `
            --clean `
            --additional-hooks-dir pyinstaller_hooks `
            --collect-all rapidocr `
            --collect-all docling `
            --collect-all docling_core `
            --add-data "$env:RAPIDOCR_YAML;rapidocr" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            desktop.py

      - name: Verify Windows package
        shell: pwsh
        run: |
          $exe = "dist\Docling\Docling.exe"
          $rapidocrYaml = "dist\Docling\_internal\rapidocr\default_models.yaml"
          $indexTemplate = "dist\Docling\_internal\templates\index.html"
          $staticDirectory = "dist\Docling\_internal\static"

          $requiredFiles = @(
            $exe,
            $rapidocrYaml,
            $indexTemplate
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required Windows package file is missing: $file"
            }

            Write-Host "Verified: $file"
          }

          if (!(Test-Path $staticDirectory)) {
            throw "Static directory was not packaged: $staticDirectory"
          }

          Write-Host "Verified: $staticDirectory"

          Write-Host "Packaged templates:"
          Get-ChildItem `
            "dist\Docling\_internal\templates" `
            -Recurse |
            Select-Object FullName

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zipName = "Docling-Windows-$env:GITHUB_SHA.zip"
          $zipPath = Join-Path "dist" $zipName

          Compress-Archive `
            -Path "dist\Docling" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zipPath)) {
            throw "Windows ZIP was not created: $zipPath"
          }

          "WINDOWS_ZIP=$zipPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Created: $zipPath"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Windows-${{ github.sha }}
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error
          compression-level: 0